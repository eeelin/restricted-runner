services:
  runner:
    build:
      context: ../..
      dockerfile: docker/runner/Dockerfile
    image: restricted-runner-gha-runner:local
    container_name: restricted-runner-gha-runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNER_NAME: ${RUNNER_NAME:-restricted-runner-gha}
      RUNNER_WORKDIR: /home/runner/_work
    volumes:
      - runner-work:/home/runner/_work
      - runner-state:/home/runner/.runner-state
      - ./ssh:/home/runner/.ssh:ro
    command: /usr/local/bin/start-runner

volumes:
  runner-work:
  runner-state:
